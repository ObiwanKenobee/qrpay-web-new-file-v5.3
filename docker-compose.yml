version: "3.9"

name: qrpay

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: qrpay-web:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - .env.docker
    environment:
      # Safe defaults; override via .env/.env.docker
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Optional: run DB migrations automatically on first boot in dev
      MIGRATE_ON_BOOT: ${MIGRATE_ON_BOOT:-false}
    ports:
      - "8080:80"
    volumes:
      # Persist user uploads and caches between container restarts
      - storage:/var/www/html/storage
      - cache:/var/www/html/bootstrap/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health.php"]
      interval: 30s
      timeout: 5s
      retries: 5

  db:
    image: mysql:8.0
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-qrpay}
      MYSQL_USER: ${DB_USERNAME:-qrpay}
      MYSQL_PASSWORD: ${DB_PASSWORD:-qrpay}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 30s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  storage:
  cache:
  dbdata:
  redisdata:
