name: deploy-ecs

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}           # e.g. qrpay-app
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}                 # e.g. qrpay-cluster
  ECS_SERVICE: ${{ vars.ECS_SERVICE }}                 # e.g. qrpay-service
  CONTAINER_NAME: app                                 # set default container name; override via repo vars if needed

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -f docker/Dockerfile -t $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG .
          docker push $ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          echo "IMAGE_URI=$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Render Amazon ECS task definition
        id: render-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ecs-task-def.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ env.IMAGE_URI }}

      - name: Register task definition revision
        id: register-td
        env:
          RENDERED_TD: ${{ steps.render-taskdef.outputs.task-definition }}
        run: |
          set -euo pipefail
          TD_ARN=$(aws ecs register-task-definition --cli-input-json file://$RENDERED_TD --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "TASKDEF_ARN=$TD_ARN" >> $GITHUB_ENV

      - name: Run database migrations (one-off task) [optional]
        if: ${{ vars.MIGRATE_BEFORE_DEPLOY == 'true' }}
        env:
          SUBNETS: ${{ vars.ECS_SUBNETS }}
          SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
        run: |
          set -euo pipefail
          if [ -z "$SUBNETS" ] || [ -z "$SECURITY_GROUPS" ]; then
            echo "ECS_SUBNETS or ECS_SECURITY_GROUPS not set in repo variables; skipping migrations";
            exit 0;
          fi
          TASK_JSON=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASKDEF_ARN" \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=ENABLED}" \
            --overrides '{"containerOverrides":[{"name":"'"$CONTAINER_NAME"'","command":["php","artisan","migrate","--force"]}]}' )
          TASK_ARN=$(echo "$TASK_JSON" | jq -r '.tasks[0].taskArn')
          echo "Started migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          DESC=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN")
          EXIT_CODE=$(echo "$DESC" | jq -r '.tasks[0].containers[0].exitCode')
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed with exit code $EXIT_CODE" >&2
            exit 1
          fi
          echo "Migrations completed successfully"

      - name: Update ECS service to new task definition
        run: |
          set -euo pipefail
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --task-definition "$TASKDEF_ARN"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
