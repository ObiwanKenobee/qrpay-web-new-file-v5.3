# Nginx performance tweaks for static assets and gzip
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/x-javascript
  application/json
  application/xml
  application/xml+rss
  image/svg+xml;

# Cache built assets aggressively (immutable file names from Vite)
location ^~ /build/ {
  alias /var/app/current/public/build/;
  access_log off;
  expires 1y;
  add_header Cache-Control "public, immutable";
  try_files $uri =404;
}

# General static file caching
location ~* \.(?:css|js|mjs|map|svg|ico|gif|jpg|jpeg|png|webp|woff|woff2|ttf)$ {
  access_log off;
  expires 7d;
  add_header Cache-Control "public";
  try_files $uri =404;
}
